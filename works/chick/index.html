<style>
/* Layout: one centered phone-width column. Stats on top, a 5x5 pen in the middle, thumb-reach buttons at the bottom. */
:root {

[hidden] { display: none !important; }

.board-wrap::before, .board-wrap::after { content: ''; flex: 1 1 0; min-height: 0; }
.board-wrap::after { flex-grow: 2; }
.cstrip { position: relative; flex: none; width: 100%; height: 0; z-index: 7; }

.board { width: 100%; box-sizing: border-box; display: grid; grid-template-columns: repeat(var(--cols, 4), 1fr); gap: 8px; padding: 10px; background: var(--panel);
  border-radius: 20px; container-type: inline-size; touch-action: none; }

.fx { position: absolute; inset: 0; pointer-events: none; overflow: visible; }

.cfx { position: absolute; left: 0; right: 0; top: -50px; height: 44px; z-index: 7; display: flex; align-items: center; justify-content: center; gap: 10px; pointer-events: none; --c: #ffcf3f; }
.cnum { font-family: var(--font-display); line-height: 1; color: var(--c); font-size: 28px; letter-spacing: .02em; display: flex; align-items: baseline; gap: 5px; white-space: nowrap;

.cbar { position: absolute; left: 50%; bottom: 1px; width: 132px; margin-left: -66px; height: 4px; border-radius: 4px; background: rgba(0,0,0,.38); overflow: hidden; }

.cfx.lv1 { --c: #ffcf3f; } .cfx.lv2 { --c: #ff9d2e; } .cfx.lv3 { --c: #ff5d7a; } .cfx.lv4 { --c: #d27bff; } .cfx.lv5 { --c: #5fd8ff; } .cfx.lv6 { --c: #ff6bd6; }
.cfx.lv2 .cnum { font-size: 30px; } .cfx.lv3 .cnum { font-size: 32px; } .cfx.lv4 .cnum { font-size: 34px; } .cfx.lv5 .cnum { font-size: 36px; } .cfx.lv6 .cnum { font-size: 38px; }
.cfx.lv6 .cnum { animation: rainbow 1.2s linear infinite; }

.sky { position: absolute; inset: 0; overflow: hidden; pointer-events: none; border-radius: 20px; }

  display: flex; flex-direction: column; justify-content: center; gap: 0; line-height: 1.2; position: relative; touch-action: manipulation; }

/* 设置面板 */
.sheet.set { gap: 10px; }
.srow { background: var(--cell); border-radius: 16px; padding: 10px 14px; display: flex; flex-direction: column; gap: 6px; }

/* 首页 */
.home { position: fixed; inset: 0; z-index: 90; overflow: hidden;
  background: radial-gradient(ellipse 90% 42% at 50% 100%, rgba(255,184,77,.34), transparent 72%),
    linear-gradient(180deg, #0a1b2c 0%, #123852 38%, #1a5560 68%, #23605a 100%); }

.bubbles { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }

  padding: max(20px, env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) max(20px, env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px)); }
.home-in { width: min(100%, 340px); margin: auto; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
.herd { display: flex; justify-content: center; gap: 6px; margin-bottom: 22px; }

.home-title { position: relative; margin: 6px 0 0; display: flex; justify-content: center; gap: 2px; font-family: var(--font-display); font-weight: 400; font-size: 66px; line-height: 1.05; }

  filter: drop-shadow(0 5px 0 #7a3b00) drop-shadow(0 12px 10px rgba(0,0,0,.38)); animation: wob 2.6s ease-in-out infinite; animation-delay: calc(var(--k) * -.4s); }
.tc::after { content: attr(data-c); position: absolute; left: 0; top: 0; -webkit-text-stroke: 0; color: transparent;
  background: linear-gradient(180deg, #fffbd0 0%, #ffe066 36%, #ffb02e 70%, #ff8a1f 100%); -webkit-background-clip: text; background-clip: text; }
@keyframes wob { 0%, 100% { transform: translateY(0) rotate(var(--r)); } 50% { transform: translateY(-9px) rotate(calc(var(--r) * -1)); } }
.hat { position: absolute; right: -10px; top: -30px; font-size: 38px; transform: rotate(14deg); animation: hop 1.8s ease-in-out infinite; filter: drop-shadow(0 4px 4px rgba(0,0,0,.35)); }

<script>
(() => {
  // ===== 数据 =====
  // 每个等级的基础收益在所有世界里一样，每个世界只是换一套动物
  const INC = [1, 3, 8, 22, 60, 160, 430, 1200, 3300, 9000, 25000, 68000, 190000, 520000];
  const WORLDS = [
    { name: '起源', icon: '🥚', t: [['🥚','小蛋'],['🐣','破壳雏鸟'],['🐥','小黄鸡'],['🐔','大母鸡'],['🦆','鸭鸭'],['🦜','鹦鹉'],['🦚','孔雀'],['🦅','苍鹰'],['🦁','狮王'],['🐘','巨象'],['🐋','蓝鲸'],['🦖','霸王龙'],['🐲','神龙'],['🦄','独角兽']] },
    { name: '深海', icon: '🌊', t: [['🐚','贝壳'],['🦀','小蟹'],['🦐','小虾'],['🐟','小鱼'],['🐠','热带鱼'],['🐡','河豚'],['🦑','乌贼'],['🐙','章鱼'],['🐢','海龟'],['🦈','鲨鱼'],['🐬','海豚'],['🐳','蓝鲸'],['🔱','三叉戟'],['🧜','美人鱼']] },
    { name: '森林', icon: '🌲', t: [['🌰','橡果'],['🌱','幼苗'],['🍄','蘑菇'],['🐛','毛毛虫'],['🦋','蝴蝶'],['🐿️','松鼠'],['🐇','兔子'],['🦊','狐狸'],['🦌','麋鹿'],['🐻','棕熊'],['🐺','灰狼'],['🦉','猫头鹰'],['🌳','古树'],['🧝','森林精灵']] },
    { name: '星空', icon: '🌌', t: [['☄️','彗星'],['🌙','月亮'],['⭐','星星'],['🌟','耀星'],['💫','流光'],['🪐','星环行星'],['☀️','太阳'],['🚀','火箭'],['🛸','飞碟'],['🛰️','卫星'],['👽','外星人'],['🌌','银河'],['🌠','流星雨'],['🔮','宇宙之核']] }
  ];
  const TIERS = INC.map(inc => ({ e: '', n: '', inc: inc }));
  const COLS = 4, ROWS = 4, N = COLS * ROWS;
  const KEY = 'merge-chick-v2';
  const REDUCE = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ===== 状态（纯数据，和画面分开，方便以后移植到小程序）=====
  function fresh() {
    const b = Array(N).fill(-1); b[5] = 0; b[6] = 0;
    return { coins: 30, board: b, summons: 0, up: 0, best: 0, sound: true, playTime: 0, reach: [0], since: 0, stars: 0, rebirths: 0, dexBest: [], fastest: 0, fxLite: false, sfxVol: 0.8, musicOn: true, musicVol: 0.5, vib: true, pendingOffline: 0 };
  }
  const pickSet = o => ({ sound: o.sound, fxLite: o.fxLite, sfxVol: o.sfxVol, musicOn: o.musicOn, musicVol: o.musicVol, vib: o.vib });
  function load() {
    try {
      const raw = localStorage.getItem(KEY); if (!raw) return null;
      const d = JSON.parse(raw);
      if (!d || !Array.isArray(d.board)) return null;
      if (d.board.length !== N) {
        // 旧版棋盘格子数不同：高级的优先留下，放不下的按价值折成金币
        const items = d.board.filter(v => v >= 0).sort((a, b) => b - a), keep = items.slice(0, N), extra = items.slice(N);
        d.coins = (d.coins || 0) + extra.reduce((a, t) => a + (INC[Math.min(t, INC.length - 1)] || 1) * 30, 0);
        d.board = keep.concat(Array(N - keep.length).fill(-1));
      }
      if (!d.dexBest && typeof d.bestEver === 'number') d.dexBest = [d.bestEver];
      d.dexBest = (Array.isArray(d.dexBest) ? d.dexBest : []).map(v => Math.max(0, Math.min(+v || 0, INC.length - 1)));
      d.board = d.board.map(v => Math.min(v, INC.length - 1));
      d.best = Math.min(d.best || 0, INC.length - 1);
      return Object.assign(fresh(), d);
    } catch (e) { return null; }
  }
  let S = load() || fresh();
  let daily = null, mainS = null, pendingBoost = 0;   // 每日挑战进行时：daily 有值，主线存档暂存在 mainS
  let savedAt = 0;
  try { savedAt = +JSON.parse(localStorage.getItem(KEY) || '{}').savedAt || 0; } catch (e) {}
  function save() {
    if (daily) return;
    syncDex();
    try { S.savedAt = Date.now(); localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  }

  // ===== 随机数：每日挑战里，同一天所有人的“运气序列”相同 =====
  const hash32 = str => { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
  const mulberry = a => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const R = name => { if (!daily) return Math.random(); const f = daily.streams[name] || (daily.streams[name] = mulberry(hash32(daily.key + '|' + name))); return f(); };
  // 每天一条规则（按北京时间的星期轮换），只在每日挑战里生效
  const DAILY_RULES = [
    { icon: '⚖️', name: '标准日', desc: '没有特殊规则，纯拼手速。' },
    { icon: '🍀', name: '幸运日', desc: '召唤时有 35% 的几率直接出高一级的动物。', luck: 0.35 },
    { icon: '🎁', name: '空投潮', desc: '每隔十几秒就有一个动物空投，抓紧点。', giftEvery: [12, 16] },
    { icon: '🎒', name: '先发优势', desc: '开局棚里就有 4 对 Lv3 动物。', start: 3 },
    { icon: '👯', name: '双胞胎日', desc: '每次召唤出两只相同的动物，只收一只的钱。', twin: true },
    { icon: '⚡', name: '暴击日', desc: '每次合成有 20% 的几率直接多升一级。', crit: 0.2 },
    { icon: '⏱', name: '加时赛', desc: '挑战时间延长到 4 分钟。', dur: 240 }
  ];
  const MAX_TRIES = 3, DKEY = 'merge-chick-daily-v1';
  const dayKeyNow = () => new Date(Date.now() + 8 * 3600e3).toISOString().slice(0, 10);
  const dayInfo = key => { const ms = Date.parse(key + 'T00:00:00Z'); return { num: Math.floor(ms / 864e5), wd: new Date(ms).getUTCDay() }; };
  let D = { day: '', tries: 0, best: null, claimed: false, ever: null };
  function loadD() {
    try { const d = JSON.parse(localStorage.getItem(DKEY) || 'null'); if (d && typeof d === 'object') D = Object.assign(D, d); } catch (e) {}
    const k = dayKeyNow(); if (D.day !== k) { D.day = k; D.tries = 0; D.best = null; D.claimed = false; }
    return D;
  }
  function saveD() { try { localStorage.setItem(DKEY, JSON.stringify(D)); } catch (e) {} }

  // ===== 规则 =====
  const upMult = () => 1 + 0.25 * S.up;
  const starMult = () => 1 + 0.5 * S.stars;
  const mult = () => upMult() * starMult();
  // 每重生一次多解锁 2 级动物，最多 18 级
  const worldIdx = () => S.rebirths % WORLDS.length;
  const world = () => WORLDS[worldIdx()];
  function applyWorld() { world().t.forEach((x, i) => { TIERS[i].e = x[0]; TIERS[i].n = x[1]; }); }
  const dexBest = () => Math.max(0, Math.min(S.dexBest[worldIdx()] || 0, INC.length - 1));
  function syncDex() { const w = worldIdx(); S.dexBest[w] = Math.max(S.dexBest[w] || 0, S.best); }
  const tierCap = () => TIERS.length;
  const topTier = () => TIERS.length - 1;
  // 召唤出的动物比当前最高级低几级：主线 6 级起步，每攒 10 颗★近一级，最少 3 级；每日挑战固定 5 级
  const gapOf = stars => daily ? 5 : Math.max(3, 6 - Math.floor(stars / 10));
  const REBIRTH_MIN = 9;
  const rebirthGain = () => Math.max(1, S.best - 8);
  let boostUntil = 0;
  const boosted = () => performance.now() < boostUntil;

  function buildHomeBg() {
    const R = (a, b) => a + Math.random() * (b - a); let h = '';
    for (let i = 0; i < 26; i++) h += '<i class="star" style="left:' + R(2, 98).toFixed(1) + '%;top:' + R(1, 50).toFixed(1) + '%;--s:' + R(1.2, 3).toFixed(1) + 'px;animation-delay:-' + R(0, 4).toFixed(1) + 's;animation-duration:' + R(2.2, 4.5).toFixed(1) + 's"></i>';
    ['🥚', '🐣', '🐥', '🥚', '🐤', '🐣', '🥚', '🐥'].forEach((e, i) => { h += '<b class="drift" style="left:' + (6 + i * 12 + R(-3, 3)).toFixed(1) + '%;font-size:' + R(20, 34).toFixed(0) + 'px;animation-duration:' + R(16, 26).toFixed(1) + 's;animation-delay:-' + R(0, 20).toFixed(1) + 's">' + e + '</b>'; });
    for (let i = 0; i < 14; i++) h += '<u class="fly" style="left:' + R(4, 96).toFixed(1) + '%;top:' + R(60, 92).toFixed(1) + '%;animation-duration:' + R(5, 10).toFixed(1) + 's;animation-delay:-' + R(0, 8).toFixed(1) + 's"></u>';
    $('#bubbles').innerHTML = h;
  }
  const hasProgress = () => S.summons > 0 || S.best > 0 || S.up > 0 || S.rebirths > 0 || S.playTime > 5;
  function renderHome() { try { renderHomeInner(); } catch (e) { $('#homeCard').textContent = ''; } }
  function renderHomeInner() {
    const known = Math.min(Math.max(dexBest(), S.best), topTier()), end = Math.max(4, known), start = end - 4, prog = hasProgress();
    let h = '';
    for (let t = start; t <= end; t++) h += '<span style="--k:' + (t - start) + '" class="' + (t <= Math.max(known, 2) ? '' : 'sil') + '">' + TIERS[t].e + '</span>';
    $('#herd').innerHTML = h;
    const card = $('#homeCard');
    if (prog) {
      card.className = 'home-info';
      card.innerHTML = '<span>第 ' + (S.rebirths + 1) + ' 世 · ' + world().icon + world().name + '</span><span><b>★' + S.stars + '</b> · 永久 x' + starMult().toFixed(2) + '</span><span>图鉴 ' + (known + 1) + '/' + tierCap() + '</span>';
    } else {
      card.className = 'home-card';
      card.innerHTML = '<ol><li>点「召唤」得到动物</li><li>相同的两只拖到一起，合成更大的</li><li>点一下动物收金币，空闲时也会自己赚</li></ol>';
    }
    $('#startTxt').textContent = prog ? '继续游戏' : '开始游戏';
    $('#restartBtn').hidden = !prog;
    renderDailyBtn();
  }
  let firstRun = !savedAt;
  $('#startBtn').addEventListener('click', () => {
    ac(); sfx.summon(); homeEl.hidden = true; last = performance.now(); nextGift = Math.max(nextGift, performance.now() + 15000);
    if (pendingBoost > 0) { boostUntil = performance.now() + pendingBoost * 1000; toast('每日挑战奖励生效：收益翻倍 ' + pendingBoost + ' 秒', 3000); pendingBoost = 0; }
    else if (firstRun && !hasProgress()) toast('相同的两只拖到一起合成，点一下动物收金币', 4500);
    firstRun = false;
  });
  $('#homeSet').addEventListener('click', () => { ac(); openSettings(); });
  const homeSnd = $('#homeSnd');
  function renderHomeSnd() { homeSnd.textContent = (S.sound || S.musicOn) ? '🔊' : '🔇'; }
  homeSnd.addEventListener('click', () => { const on = !(S.sound || S.musicOn); S.sound = on; S.musicOn = on; renderSet(); renderHomeSnd(); bgmSync(); save(); if (on) { ac(); sfx.tap(); } });

  // ===== 每日挑战 =====
  const fmtRes = r => r.emoji + ' Lv' + (r.tier + 1) + ' · ' + fmtTime(r.t);
  function renderDailyBtn() {
    loadD();
    const left = MAX_TRIES - D.tries;
    $('#dailySub').textContent = (left > 0 ? '今日剩余 ' + left + ' 次' : '今日已打完') + (D.best ? ' · 最佳 ' + fmtRes(D.best) : '');
    $('#dailyDot').hidden = !(left > 0 && !D.best);
  }
  const dyModal = $('#dyModal');
  function openDailyIntro() {
    loadD();
    const info = dayInfo(D.day), rule = DAILY_RULES[info.wd], left = MAX_TRIES - D.tries, dur = rule.dur || 180;
    const wk = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'][info.wd];
    $('#dyTitle').textContent = '每日挑战';
    $('#dyRule').innerHTML = '<span class="ri">' + rule.icon + '</span><div><b>今日规则：' + rule.name + '</b><small>' + rule.desc + '</small></div>';
    const refresh = Math.floor((864e5 - ((Date.now() + 8 * 3600e3) % 864e5)) / 60000);
    const lines = [['日期', D.day.slice(5).replace('-', '月') + '日 ' + wk], ['挑战时长', Math.round(dur / 60) + ' 分钟'], ['今日剩余次数', left + ' / ' + MAX_TRIES], ['今日最佳', D.best ? fmtRes(D.best) : '还没有成绩'], ['历史最佳', D.ever ? fmtRes(D.ever) + '（' + D.ever.day.slice(5) + '）' : '—']];
    $('#dyLines').innerHTML = lines.map(l => '<li><span>' + l[0] + '</span><span>' + l[1] + '</span></li>').join('');
    $('#dyNote').textContent = '限时冲刺：时间内合成得越高越好，同级比谁先到。同一天所有人的运气序列相同，每天 ' + MAX_TRIES + ' 次取最高分。' + (D.claimed ? '' : '今天第一次打完有奖励。') + (left > 0 ? '' : '明天再来（约 ' + Math.floor(refresh / 60) + ' 小时 ' + (refresh % 60) + ' 分后刷新）。');
    $('#dyGo').disabled = left <= 0; $('#dyGoT').textContent = left > 0 ? '开始挑战' : '明天再来';
    dyModal.hidden = false; (left > 0 ? $('#dyGo') : $('#dyBack')).focus();
  }
  function closeDailyIntro() { dyModal.hidden = true; }
  $('#dailyBtn').addEventListener('click', () => { ac(); openDailyIntro(); });
  $('#dyBack').addEventListener('click', closeDailyIntro);
  dyModal.addEventListener('pointerdown', e => { if (e.target === dyModal) closeDailyIntro(); });
  $('#dyGo').addEventListener('click', () => { ac(); startDaily(); });

  function runCountdown(done) {
    const el = $('#cd'), seq = ['3', '2', '1', '开始！']; let i = 0; el.hidden = false;
    const step = () => {
      if (!daily) { el.hidden = true; return; }
      el.textContent = seq[i]; el.classList.remove('go'); void el.offsetWidth; el.classList.add('go'); sfx.tap(); i++;
      if (i < seq.length) setTimeout(step, 700); else setTimeout(() => { el.hidden = true; if (daily) done(); }, 600);
    };
    step();
  }
  function startDaily() {
    loadD(); if (D.tries >= MAX_TRIES) return;
    D.tries++; saveD();
    if (!mainS) { syncDex(); save(); mainS = S; }
    const info = dayInfo(D.day), rule = DAILY_RULES[info.wd];
    clearGift(); closeDailyIntro(); $('#dyResult').hidden = true;
    S = Object.assign(fresh(), pickSet(mainS), { coins: 100, rebirths: info.num % WORLDS.length });
    if (rule.start) { [0, 1, 2, 3, 4, 7, 8, 9].forEach(i => { S.board[i] = rule.start - 1; }); S.best = rule.start - 1; S.reach[S.best] = 0; }
    daily = { key: D.day, rule: rule, streams: {}, running: false, finished: false, dur: rule.dur || 180, nextGift: 0 };
    scheduleGift(); daily.nextGift = Math.min(daily.nextGift, rule.giftEvery ? 8 : 20);
    boostUntil = 0; resetCombo(); applyWorld(); renderAll(); renderSet();
    homeEl.hidden = true;
    runCountdown(() => { daily.running = true; last = performance.now(); });
  }
  function persistMain() { try { mainS.savedAt = Date.now(); localStorage.setItem(KEY, JSON.stringify(mainS)); } catch (e) {} }
  function finishDaily() {
    if (!daily || daily.finished) return;
    daily.finished = true; daily.running = false;
    const best = S.best, tReach = Math.min(daily.dur, S.reach[best] || 0), score = best * 1000 + Math.round(daily.dur - tReach);
    const prevDay = D.best ? D.best.score : -1, prevEver = D.ever ? D.ever.score : -1;
    const res = { score: score, tier: best, t: Math.round(tReach), emoji: TIERS[best].e, name: TIERS[best].n };
    const newDay = score > prevDay, newEver = score > prevEver;
    if (newDay) D.best = res; if (newEver) D.ever = Object.assign({ day: D.day }, res);
    let rewardTxt = '';
    if (!D.claimed) {   // 今天第一次打完：奖励直接发到主线存档
      D.claimed = true;
      const min = Math.min(20, 5 + best), saved = S; S = mainS;
      const amt = Math.max(income() * 60 * min, summonCost() * 5); S = saved;
      mainS.coins += amt; persistMain(); pendingBoost = 60;
      rewardTxt = '首次完成奖励：+' + fmt(amt) + ' 金币（约 ' + min + ' 分钟收益），回到主线后再送 60 秒双倍。';
    } else rewardTxt = '今天的首次奖励已经领过了，继续刷新纪录吧。';
    saveD(); sfx.unlock(); vib([20, 40, 20]);
    $('#dyBig').innerHTML = res.emoji + (newDay ? '<em>今日新高</em>' : '') + '<small>Lv' + (best + 1) + ' ' + res.name + ' · 用时 ' + fmtTime(res.t) + '</small>';
    $('#dyResLines').innerHTML = [['本次得分', score], ['今日最佳', D.best ? fmtRes(D.best) : '—'], ['历史最佳', D.ever ? fmtRes(D.ever) : '—']].map(l => '<li><span>' + l[0] + '</span><span>' + l[1] + '</span></li>').join('');
    $('#dyReward').textContent = rewardTxt;
    const left = MAX_TRIES - D.tries; $('#dyAgain').disabled = left <= 0; $('#dyAgainT').textContent = left > 0 ? '再来一次' : '次数用完'; $('#dyAgainS').textContent = left > 0 ? '今日还剩 ' + left + ' 次' : '明天再来';
    $('#dyResult').hidden = false; $('#dyExit').focus();
  }
  $('#dyAgain').addEventListener('click', () => { ac(); startDaily(); });
  $('#dyExit').addEventListener('click', () => { $('#dyResult').hidden = true; exitDaily(); });
  function exitDaily() {
    if (!mainS) { daily = null; return; }
    Object.assign(mainS, pickSet(S));
    S = mainS; mainS = null; daily = null;
    clearGift(); boostUntil = 0; resetCombo(); $('#cd').hidden = true;
    applyWorld(); renderAll(); renderSet(); save(); renderHome(); homeEl.hidden = false;
  }

  applyWorld(); renderAll(); renderSet(); buildHomeBg(); renderHomeSnd();
  if (savedAt) giveOffline((Date.now() - savedAt) / 1000);
  renderHome();
  if ((S.pendingOffline || 0) >= 1) showOffline();
})();
</script>

</body></html>
